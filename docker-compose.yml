services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectfinder_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-projectfinder.settings.prod}
      PORT: ${PORT:-8000}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      # Supabase PostgreSQL database URL or local DB connection
      DATABASE_URL: ${DATABASE_URL}
      DB_DISABLE_SERVER_SIDE_CURSORS: ${DB_DISABLE_SERVER_SIDE_CURSORS:-false}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-0}
      DB_SSL_REQUIRE: ${DB_SSL_REQUIRE:-true}
      # Deployment triggers
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      COLLECT_STATIC: ${COLLECT_STATIC:-false}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
      # CORS and Security
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional local PostgreSQL service for offline development
  # Start with: docker compose --profile local-db up
  local-db:
    image: postgres:16-alpine
    container_name: projectfinder_local_postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: ${DB_NAME:-projectfinder}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-projectfinder}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  media_data:
  pgdata:
