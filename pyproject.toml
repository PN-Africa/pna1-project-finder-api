[project]
name = "project-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Justin Anyika", email = "justinharryjayd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-rest-auth[with-social]>=7.2.0",
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "mysqlclient>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
project-finder = "project_finder:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
