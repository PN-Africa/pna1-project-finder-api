[project]
name = "project-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Justin Anyika", email = "justinharryjayd@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
